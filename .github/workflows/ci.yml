name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json. Testing the floor (not a newer
          # version) is what catches "works on 24, broken on 22".
          node-version: '22'
      - run: npm ci || npm install
      - name: Unit tests (transform, client, schema-drift logic)
        run: npm test

# Note: the live SDK <-> BigQuery schema-drift check is not run here. It needs warehouse
# credentials this repo does not hold, and its previous incarnation used `secrets` inside a
# step-level `if`, which is invalid and silently broke this entire workflow. Run it locally
# (`npm run check:schema -- --project=… --dataset=…`, see CONTRIBUTING.md). To bring it back
# into CI, prefer the credential-free offline mode (`--schema-dir` against committed schema
# snapshots) in its own workflow, so it can never take the unit tests down again.
